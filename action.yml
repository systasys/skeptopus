name: SkeptOpus
description: "SkeptOpus checks specific AI coding claims and leaves an evidence receipt on pull requests."
author: SYSTASYS
branding:
  icon: eye
  color: red

# Use it on `pull_request`, never on `pull_request_target`: the pull request's own code is checked out here.
inputs:
  who:
    description: "Which pull requests get a receipt: 'ai-agents' (the default: opened, pushed or co-written by Copilot, Codex, Claude Code, Cursor, Devin, Jules...) or 'everyone'."
    default: ai-agents
  fail-on:
    description: "What fails the run: 'contradicted' (the default), 'problems' (contradicted or not found), 'anything' (anything not seen) or 'never'."
    default: contradicted
  lang:
    description: "The language of the receipt: en, fr, es, zh or ar."
    default: en
  settings:
    description: "A SkeptOpus settings file in the repository (the test command, declared measurements). Optional. The test command runs the pull request's code, as any CI does."
    default: ""
  token:
    description: "The token that reads the pull request and writes the receipt. The run's own token is enough."
    default: ${{ github.token }}

outputs:
  verdict:
    description: "The overall answer: PROVEN (seen), NOT_PROVEN (not found), CONTRADICTED, COULD_NOT_CHECK (couldn't look), NOTHING_CLAIMED, or NOT_CHECKED when no AI agent was seen."
    value: ${{ steps.look.outputs.verdict }}
  agents:
    description: "The AI agents seen on the pull request, comma separated."
    value: ${{ steps.look.outputs.agents }}
  receipt-file:
    description: "The receipt as JSON, in the runner's temporary folder."
    value: ${{ steps.look.outputs.receipt-file }}
  comment-url:
    description: "The address of the receipt on the pull request."
    value: ${{ steps.look.outputs.comment-url }}

runs:
  using: composite
  steps:
    # The workflow may have checked out the code already; if not, the whole history, without leaving the token
    # in the checkout, where the code being checked could read it.
    - name: Is the code here?
      id: here
      shell: bash
      run: if [ -d "$GITHUB_WORKSPACE/.git" ]; then echo "git=yes" >> "$GITHUB_OUTPUT"; else echo "git=no" >> "$GITHUB_OUTPUT"; fi
    - name: Check out the pull request
      if: steps.here.outputs.git == 'no'
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false
    # What the pull request says is read from GitHub by the script: it is never pasted into a command.
    - name: Check evidence, then leave the receipt
      id: look
      shell: bash
      env:
        SKEPTOPUS_TOKEN: ${{ inputs.token }}
        INPUT_WHO: ${{ inputs.who }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_LANG: ${{ inputs.lang }}
        INPUT_SETTINGS: ${{ inputs.settings }}
      run: |
        export SKEPTOPUS_HOME="$RUNNER_TEMP/skeptopus-home"
        node "$GITHUB_ACTION_PATH/core/action.mjs"
